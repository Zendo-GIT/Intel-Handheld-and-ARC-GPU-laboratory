name: Bug report
description: Report a regression or packaging problem in the water-flash fix.
title: "[Bug]: "
labels:
  - bug
body:
  - type: input
    id: version
    attributes:
      label: Mod version
      placeholder: 1.0.0
    validations:
      required: true
  - type: input
    id: game_build
    attributes:
      label: Game storefront and build
      placeholder: Steam build 10345375
    validations:
      required: true
  - type: input
    id: gpu_driver
    attributes:
      label: GPU and driver
      placeholder: Intel Arc 140V, 32.0.101.8864
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Describe the location, symptom, and steps to reproduce it.
    validations:
      required: true
  - type: textarea
    id: other_mods
    attributes:
      label: Other PAK mods
      description: List every other file currently present in the ~Mods folder.
    validations:
      required: true
