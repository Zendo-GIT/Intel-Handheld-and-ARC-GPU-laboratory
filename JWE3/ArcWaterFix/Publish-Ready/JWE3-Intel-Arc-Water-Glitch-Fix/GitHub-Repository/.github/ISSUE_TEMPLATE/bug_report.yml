name: Bug report
description: Report a failed install, compatibility problem or remaining water artifact.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Do not upload or link a JWE3 executable or other proprietary game asset.
  - type: input
    id: fix_version
    attributes:
      label: Fix version
      placeholder: 1.0.0
    validations:
      required: true
  - type: input
    id: game_version
    attributes:
      label: JWE3 file version
      placeholder: 1.4.2.0
    validations:
      required: true
  - type: input
    id: sha256
    attributes:
      label: CurrentSha256 from CHECK_STATUS.bat
      placeholder: 64-character SHA-256 value
    validations:
      required: true
  - type: input
    id: gpu
    attributes:
      label: GPU
      placeholder: Intel Arc 140V
    validations:
      required: true
  - type: input
    id: driver
    attributes:
      label: Intel graphics driver
      placeholder: 32.0.101.8864
    validations:
      required: true
  - type: dropdown
    id: store
    attributes:
      label: Storefront
      options:
        - Steam
        - Microsoft Store
        - Other
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Include the installer message and precise visual result.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      placeholder: Save, map, camera position and installation steps.
    validations:
      required: true
  - type: checkboxes
    id: confirmation
    attributes:
      label: Safety confirmation
      options:
        - label: JWE3 was closed while installing or uninstalling.
          required: true
        - label: I have not attached or linked any proprietary game executable.
          required: true
