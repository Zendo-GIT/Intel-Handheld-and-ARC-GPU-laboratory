name: Validate

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Validate PowerShell syntax and patch metadata
        shell: pwsh
        run: |
          $scriptPath = Join-Path $PWD 'JWE3-IntelArc-WaterFix.ps1'
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
              $scriptPath,
              [ref]$null,
              [ref]$errors
          ) | Out-Null
          if ($errors.Count -gt 0) {
              throw ($errors.Message -join "`n")
          }

          $source = Get-Content -LiteralPath $scriptPath -Raw
          $requiredValues = @(
              '04FA75D84683DE73AAFF7C0D5C28D8FDC5B4E900E5968022995CF84039F0A79F',
              '3A172D9261075017974897A2F4EB89F16232B5E5D711B2EA77A524394BD7FAA8',
              '0x1CB666D',
              '0x0F, 0x9D, 0xC0',
              '0x31, 0xC0, 0x90'
          )
          foreach ($value in $requiredValues) {
              if (-not $source.Contains($value)) {
                  throw "Required verified value missing: $value"
              }
          }

      - name: Reject proprietary game binaries and nested archives
        shell: pwsh
        run: |
          $forbidden = @('.exe', '.dll', '.ovl', '.arc', '.bak', '.zip', '.7z', '.rar', '.dxil')
          $matches = @(
              Get-ChildItem -LiteralPath $PWD -Recurse -File | Where-Object {
                  $_.FullName -notmatch '[\\/]\.git[\\/]' -and
                  $forbidden -contains $_.Extension.ToLowerInvariant()
              }
          )
          if ($matches.Count -gt 0) {
              throw "Forbidden release content:`n$($matches.FullName -join "`n")"
          }

      - name: Build release ZIP
        shell: pwsh
        run: .\tools\Build-Release.ps1 -Version 1.0.0
